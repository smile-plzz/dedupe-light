name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - name: Scanner regression checks
        run: dotnet run --project tests/ScannerChecks.csproj --configuration Release
      - name: Build
        run: dotnet build --configuration Release
      - name: Publish standalone app
        run: dotnet publish --configuration Release --runtime win-x64 --self-contained true --output publish
      - name: Upload Windows executable
        uses: actions/upload-artifact@v6
        with:
          name: DedupeLight-win-x64
          path: publish/DedupeLight.exe
          if-no-files-found: error
